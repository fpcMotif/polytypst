<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <radialGradient id="disc-grad" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#bfdbfe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.55" />
    </radialGradient>
    <pattern id="hatch-c" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2563eb" stroke-width="1.1" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Colored filled & hatched unit disc -->
  <circle cx="120" cy="130" r="68" fill="url(#disc-grad)" />
  <circle cx="120" cy="130" r="68" fill="url(#hatch-c)" stroke="#1d4ed8" stroke-width="2.2" />

  <!-- Horizontal axis (u) in slate -->
  <line x1="25" y1="130" x2="225" y2="130" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-c)" />
  <text x="232" y="135" font-family="Times New Roman, serif" font-size="18" font-style="italic" font-weight="bold" fill="#1e293b">u</text>

  <!-- Vertical axis (v) in slate -->
  <line x1="120" y1="230" x2="120" y2="30" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-c)" />
  <text x="102" y="32" font-family="Times New Roman, serif" font-size="18" font-style="italic" font-weight="bold" fill="#1e293b">v</text>

  <!-- Boundary & coordinate points with gold fill and dark stroke -->
  <circle cx="120" cy="130" r="4" fill="#fef08a" stroke="#0f172a" stroke-width="1.6" />
  <text x="110" y="149" font-family="Times New Roman, serif" font-size="16" font-style="italic" font-weight="bold" fill="#1e293b">0</text>

  <circle cx="188" cy="130" r="4" fill="#fef08a" stroke="#0f172a" stroke-width="1.6" />
  <text x="186" y="149" font-family="Times New Roman, serif" font-size="16" font-style="italic" font-weight="bold" fill="#1e293b">1</text>

  <circle cx="120" cy="62" r="4" fill="#fef08a" stroke="#0f172a" stroke-width="1.6" />
  <text x="128" y="61" font-family="Times New Roman, serif" font-size="17" font-style="italic" font-weight="bold" fill="#1e293b">i</text>

  <!-- (Z) label inside upper-left quadrant in navy -->
  <text x="70" y="102" font-family="Times New Roman, serif" font-size="17" font-style="italic" font-weight="bold" fill="#1e3a8a">(Z)</text>
</svg>
