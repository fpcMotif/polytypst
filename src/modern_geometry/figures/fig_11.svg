<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Disc/Circle of radius pi -->
  <circle cx="180" cy="160" r="90" stroke="#0f172a" stroke-width="1.8" fill="none" />

  <!-- Axes -->
  <line x1="60" y1="160" x2="300" y2="160" class="ax" marker-end="url(#arr-axis)" />
  <line x1="180" y1="260" x2="180" y2="60" class="ax" marker-end="url(#arr-axis)" />

  <text x="306" y="165" class="it">φ</text>
  <text x="165" y="52" class="it">θ</text>
  <text x="165" y="176" class="it">0</text>

  <!-- Arc AB highlighted on circle boundary -->
  <path d="M 243.63 96.37 A 90 90 0 0 1 266.85 136.78" stroke="#0f172a" stroke-width="3.2" fill="none" />

  <circle cx="243.63" cy="96.37" r="3.2" fill="#fff" stroke="#0f172a" stroke-width="1.5" />
  <text x="251.63" y="92.37" class="it" font-weight="bold">A</text>

  <circle cx="266.85" cy="136.78" r="3.2" fill="#fff" stroke="#0f172a" stroke-width="1.5" />
  <text x="274.85" y="140.78" class="it" font-weight="bold">B</text>

  <!-- Radius vector to arc point -->
  <line x1="180" y1="160" x2="240" y2="120" stroke="#0f172a" stroke-width="1.6" />
  <text x="205" y="135" class="it" fill="#0f172a">θ</text>
  <text x="222" y="152" class="it" fill="#0f172a">φ</text>

  <!-- Label theta = pi -->
  <text x="240" y="245" class="it" font-weight="bold">θ = π</text>

</svg>