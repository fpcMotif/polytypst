<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Axes -->
  <line x1="90" y1="220" x2="175" y2="275" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)" />
  <line x1="90" y1="220" x2="340" y2="220" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)" />
  <line x1="90" y1="220" x2="90" y2="45" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr)" />

  <!-- Origin -->
  <circle cx="90" cy="220" r="3.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  <text x="74" y="236" class="it">0</text>

  <!-- Labels on axes -->
  <text x="183" y="287" class="it" fill="#0f172a">x<tspan dy="-6" font-size="11">1</tspan></text>
  <text x="348" y="225" class="it" fill="#0f172a">x<tspan dy="-6" font-size="11">2</tspan></text>
  <text x="72" y="49" class="it" fill="#0f172a">x<tspan dy="-6" font-size="11">3</tspan></text>

  <!-- Projection lines in plane x1-x2 -->
  <line x1="135.0" y1="249.11764705882354" x2="285.0" y2="249.11764705882354" class="c-dash" />
  <line x1="240" y1="220" x2="285.0" y2="249.11764705882354" class="c-dash" />
  <line x1="285.0" y1="249.11764705882354" x2="285.0" y2="139.11764705882354" class="c-dash" stroke-width="1.3" />

  <!-- Point P -->
  <circle cx="285.0" cy="139.11764705882354" r="3.8" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="295.0" y="133.11764705882354" class="it" font-weight="bold">P = (x<tspan dy="-5" font-size="11">1</tspan><tspan dy="5">, x</tspan><tspan dy="-5" font-size="11">2</tspan><tspan dy="5">, x</tspan><tspan dy="-5" font-size="11">3</tspan><tspan dy="5">)</tspan></text>

</svg>