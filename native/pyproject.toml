[project]
name = "polytypst-native"
version = "0.1.0"
requires-python = ">=3.15"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]

[tool.maturin]
features = ["pyo3/extension-module"]
