[project]
name = "polytypst"
version = "0.1.0"
description = "Universal tool to turn complex PDFs into beautiful Typst, LaTeX, and EPUB with neural OCR and Jev 1.14 vision grounding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
]

[project.scripts]
polytypst = "polytypst.cli:main"
polytypst-colab = "polytypst.ocr.colab_cli:main"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
markers = ["slow: compiles Typst many times; skip with -m 'not slow'"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["polytypst"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["BLE001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fitz".msg = "The `fitz` API is deprecated and will be removed in future. Use `import pymupdf` instead."

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.1",
]

[tool.setuptools]
package-dir = { "polytypst" = "src" }
packages = [
    "polytypst",
    "polytypst.ahlfors",
    "polytypst.algebra2",
    "polytypst.algebra3",
    "polytypst.bourbaki",
    "polytypst.bourbaki_lie",
    "polytypst.compiler",
    "polytypst.fermat",
    "polytypst.fga",
    "polytypst.fichtenholz_vol1",
    "polytypst.functional_analysis",
    "polytypst.goursat",
    "polytypst.grothendieck",
    "polytypst.hecke",
    "polytypst.kashiwara",
    "polytypst.kenji_alg",
    "polytypst.kerodon",
    "polytypst.klein",
    "polytypst.kodaira",
    "polytypst.london_treasury",
    "polytypst.modern_geometry",
    "polytypst.modern_geometry_vol2",
    "polytypst.modern_geometry_vol3",
    "polytypst.ocr",
    "polytypst.ode_arnold",
    "polytypst.parity",
    "polytypst.sga4_5",
    "polytypst.siegel_symplectic",
    "polytypst.taocp",
    "polytypst.vision",
    "polytypst.複素多様体論",
]

[tool.setuptools.package-data]
"*" = ["*.typ", "**/*.typ"]
"polytypst" = ["[0-9]*/*.py"]
