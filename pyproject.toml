[project]
name = "polytypst"
version = "0.1.0"
description = "Universal tool to turn complex PDFs into beautiful Typst, LaTeX, and EPUB with neural OCR and Jev 1.14 vision grounding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pytest>=8.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
polytypst = "polytypst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
