[project]
name = "polytypst"
version = "0.1.0"
description = "Universal tool to turn complex PDFs into beautiful Typst, LaTeX, and EPUB with neural OCR and Jev 1.14 vision grounding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pytest>=8.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
polytypst = "polytypst.cli:main"
polytypst-colab = "polytypst.ocr.colab_cli:main"

[tool.pytest.ini_options]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fitz".msg = "The `fitz` API is deprecated and will be removed in future. Use `import pymupdf` instead."

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "polytypst" = "src" }
packages = [
    "polytypst",
    "polytypst.ahlfors",
    "polytypst.bourbaki",
    "polytypst.bourbaki_lie",
    "polytypst.compiler",
    "polytypst.fermat",
    "polytypst.goursat",
    "polytypst.kashiwara",
    "polytypst.kerodon",
    "polytypst.klein",
    "polytypst.kodaira",
    "polytypst.ocr",
    "polytypst.parity",
    "polytypst.parser",
    "polytypst.taocp",
    "polytypst.vision",
]

[tool.setuptools.package-data]
"*" = ["*.typ", "**/*.typ"]
