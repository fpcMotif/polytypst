title = "A Comprehensive Introduction to Differential Geometry, Vol. 1, 3rd Edition"
author = "Michael Spivak"
domain = "math"
source_pdf = "A Comprehensive Introduction to Differential Geometry, Vol.1, 3rd Edition (Michael Spivak).pdf"
pdf_page_count = 508
cross_references = true
commutative_diagrams = true
# The transcripts keep the scan's running heads, "Chapter 8" or the chapter title in title case, as headings.
# The chapter openings set "CHAPTER 8" and the title in capitals, so these patterns match case.
running_header_regexes = [
  '^(?:#+\s*)?(?:\d{1,3}\s+)?\*?(?-i:Chapter \d{1,2}|Appendix [A-Z]|Manifolds|Differentiable Structures|The Tangent Bundle|Tensors|Vector Fields and Differential Equations|Integral Manifolds|Differential Forms|Integration|Riemannian Metrics|Lie Groups|Excursion in the Realm of Algebraic Topology)\*?(?:\s+\d{1,3})?$',
]
# The scan starts each chapter and the appendix on a new page; the transcript gives them as "CHAPTER 8" headings.
typst_preamble = '''
@ENGINE_PREAMBLE@
#show heading.where(level: 2): it => {
  let t = it.body.at("text", default: "")
  if t.starts-with("CHAPTER ") or t.starts-with("APPENDIX ") { pagebreak(weak: true) }
  it
}
'''
latex_preamble = '''
\renewcommand\sourcearticle[1]{\refstepcounter{sourcearticle}\setcounter{equation}{0}\subsection*{\arabic{sourcearticle}. #1}}
'''
chapters = [
  { number = 1, title = "A Comprehensive Introduction to Differential Geometry, Vol. 1, 3rd Edition", start_page = 1, end_page = 508 },
]

[hooks]
figures = 'install_diagrams'

