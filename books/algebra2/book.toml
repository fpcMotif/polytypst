ocr_prompt = '''
将此文档页面转录为精确、高保真的 Markdown 格式（符合 LaTeX 语法标准）。
规则：
1. 所有数学表达式、变量、公式均使用精确的 LaTeX 语法：行内公式用 $...$，独立公式用 $$...$$。
2. 忠实保留所有中文字符、数学专业术语（如向量空间、基底、特征值、特征向量、对偶空间、若尔当标准型、二次型、张量积等）及标点符号。
3. 文档标题、章节、节标题用 Markdown (#, ##, ###) 清晰分级。
4. 定理、引理、定义、命题、证明等数学环境加粗（如 **定理 1.**, **定义 1.1.**, **证明.**, **注.**）。
5. 独立公式如有编号请准确保留（如 (1), (2), (1.1)）。
6. 完整保留正文、脚注及作者注释，不得遗漏任何内容。'''
