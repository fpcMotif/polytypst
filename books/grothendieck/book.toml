ocr_prompt = '''
Transcribe this page from Grothendieck-Dieudonné's Éléments de Géométrie Algébrique I into clean, high-fidelity TeX-compatible Markdown.
Rules:
1. Format all mathematical expressions in exact LaTeX syntax: inline $...$ and display $$...$$.
2. Transcribe category-theory, sheaf, and scheme notations faithfully: \operatorname{Hom}, \operatorname{Spec}, \operatorname{Spf}, \operatorname{Proj}, \mathcal{O}_X, \mathcal{F}, \mathcal{G}, \otimes, \oplus, exact sequences, and commutative diagrams.
3. Format chapter, paragraph (§), and section headings with Markdown (#, ##, ###).
4. Bold structural environments: (1.1.1), **Définition**, **Proposition**, **Théorème**, **Corollaire**, **Lemme**, **Remarque**, and italicize *Démonstration.*.
5. Label display equations with exact numbering if present.
6. Do not omit any prose, definitions, proofs, or footnotes.'''

