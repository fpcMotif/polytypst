#set document(
  title: "Symplectic Geometry — Carl Ludwig Siegel",
  author: "Carl Ludwig Siegel",
  date: auto
)

#set page(
  width: 442pt,
  height: 663pt,
  margin: (inside: 56pt, outside: 56pt, top: 56pt, bottom: 62pt),
  header: context {
    let strip-fn(it) = if type(it) == content and it.has("children") { it.children.filter(c => c.func() not in (footnote, (context none).func())).join() } else if type(it) == content and it.func() == footnote { [] } else { it }
