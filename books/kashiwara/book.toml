typst_front_matter = '''
#set text(hyphenate: false)
@ENGINE_TITLE_PAGE@
#set text(hyphenate: auto)
#show figure.where(kind: image): set figure(supplement: [Figure], numbering: source-figure-dotted)
#show image: it => {
  let m = repr(it).match(regex("fig_(\d+)_(\d+)_(\d+)"))
  if m != none {
    let c = m.captures
    let num = c.at(0) + "." + c.at(1) + "." + c.at(2)
    let lbl = label("fig-" + c.at(0) + "-" + c.at(1) + "-" + c.at(2))
    let cap = if num == "2.1.7" [Figure 2.1.7. Cross-section of $hat(upright(bold(R))^2 upright(bold(C))^2)$ at $x_0$] else [Figure #num]
    [#it #v(0.4em) #block(cap)#lbl]
  } else {
    it
  }
}
#show ref: it => {
  let t = str(it.target)
  if t.starts-with("fig-") {
    let lbl = label(t.replace(".", "-"))
    let body = [Figure#sym.space.nobreak#t.slice(4).replace("-", ".")]
    if query(lbl).len() > 0 {
      return link(lbl, body)
    }
    return body
  }
  it
}
'''
