[page_fixups]
71 = [
  ['\$\$\s*\\begin\{array\}\{c\}.*?\\end\{array\}\s*\$\$\s*', ''],
]
117 = [
  [
    '\$\$\\log p_\{\\theta\}\(x\)\$\$\s*\$\$=\\log p_\{\\theta\}\(x\)\\sum_\{z\}q\(z\)\$\$\s*\$\$\\left\(\\text\{乘以\}\\sum_\{z\}q\(z\)=1\\right\)\$\$\s*\$\$=\\sum_\{z\}q\(z\)\\log p_\{\\theta\}\(x\)\$\$\s*\$\$\\left\(\\text\{将\}\\log p_\{\\theta\}\(x\)\\text\{放入\}\\Sigma\\text\{中\}\\right\)\$\$\s*\$\$=\\sum_\{z\}q\(z\)\\left\(\\log\\frac\{p_\{\\theta\}\(x,z\)\}\{q\(z\)\}\+\\log\\frac\{q\(z\)\}\{p_\{\\theta\}\(z\|x\)\}\\right\)\$\$\s*\$\$\\left\(\\text\{代入式\}5\.4\\right\)\$\$\s*\$\$=\\sum_\{z\}q\(z\)\\log\\frac\{p_\{\\theta\}\(x,z\)\}\{q\(z\)\}\+\\underbrace\{\\sum_\{z\}q\(z\)\\log\\frac\{q\(z\)\}\{p_\{\\theta\}\(z\|x\)\}\}_\{\\text\{KL散度\}\}\$\$\s*\$\$=\\sum_\{z\}q\(z\)\\log\\frac\{p_\{\\theta\}\(x,z\)\}\{q\(z\)\}\+D_\{\\text\{KL\}\}\\left\(q\(z\)\\\|p_\{\\theta\}\(z\|x\)\\right\)\$\$',
    '''$$
\begin{aligned}
\log p_{\theta}(x) &= \log p_{\theta}(x)\sum_{z}q(z) \quad \left(\text{乘以}\sum_{z}q(z)=1\right) \\
&= \sum_{z}q(z)\log p_{\theta}(x) \quad \left(\text{将}\log p_{\theta}(x)\text{放入}\Sigma\text{中}\right) \\
&= \sum_{z}q(z)\left(\log\frac{p_{\theta}(x,z)}{q(z)}+\log\frac{q(z)}{p_{\theta}(z|x)}\right) \quad \left(\text{代入式}5.4\right) \\
&= \sum_{z}q(z)\log\frac{p_{\theta}(x,z)}{q(z)}+\underbrace{\sum_{z}q(z)\log\frac{q(z)}{p_{\theta}(z|x)}}_{\text{KL散度}} \\
&= \sum_{z}q(z)\log\frac{p_{\theta}(x,z)}{q(z)}+D_{\text{KL}}\left(q(z)\|p_{\theta}(z|x)\right)
\end{aligned}
$$''',
  ],
]

