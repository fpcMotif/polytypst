<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Equator plane & vertical axis -->
  <line x1="40" y1="180" x2="350" y2="180" class="ax" marker-end="url(#arr-axis)" />
  <line x1="160" y1="280" x2="160" y2="50" class="ax" marker-end="url(#arr-axis)" />

  <!-- Sphere section (circle) -->
  <circle cx="160" cy="180" r="80" stroke="#0f172a" stroke-width="2.0" fill="none" />

  <!-- North Pole N -->
  <circle cx="160" cy="100" r="3.4" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="142" y="95" class="it" font-weight="bold">N</text>

  <!-- Center O -->
  <circle cx="160" cy="180" r="3.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  <text x="145" y="196" class="it">0</text>

  <!-- Radius to P -->
  <line x1="160" y1="180" x2="216.5685424949238" y2="123.4314575050762" stroke="#0f172a" stroke-width="1.6" />
  <text x="193.0" y="161.0" class="it">θ</text>

  <!-- Projection ray from N through P to R on equator -->
  <line x1="160" y1="100" x2="353.1370849898476" y2="180" stroke="#0f172a" stroke-width="1.8" />

  <!-- Point P on sphere -->
  <circle cx="216.5685424949238" cy="123.4314575050762" r="3.6" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="224.5685424949238" y="117.4314575050762" class="it" font-weight="bold">(θ, φ)</text>

  <!-- Projected point (r, phi) -->
  <circle cx="353.1370849898476" cy="180" r="3.6" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="338.1370849898476" y="202" class="it" font-weight="bold">(r, φ)</text>

</svg>