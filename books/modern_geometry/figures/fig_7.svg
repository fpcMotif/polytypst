<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Axes -->
  <line x1="200" y1="285" x2="200" y2="35" class="ax" marker-end="url(#arr-axis)" />
  <line x1="90" y1="210" x2="310" y2="110" class="ax" marker-end="url(#arr-axis)" />
  <line x1="120" y1="110" x2="300" y2="215" class="ax" marker-end="url(#arr-axis)" />

  <text x="178" y="42" class="it">x<tspan dy="-6" font-size="11">0</tspan></text>
  <text x="316" y="112" class="it">x<tspan dy="-6" font-size="11">2</tspan></text>
  <text x="306" y="222" class="it">x<tspan dy="-6" font-size="11">1</tspan></text>

  <!-- Upper cone filled/outlined -->
  <path d="M 140 60 L 200 160 L 260 60 A 60 22 0 0 1 140 60 Z" fill="none" stroke="none" />
  <path d="M 140 60 L 200 160 L 260 60" stroke="#0f172a" stroke-width="1.8" fill="none" />
  <ellipse cx="200" cy="60" rx="60" ry="22" stroke="#0f172a" stroke-width="1.6" fill="none" />

  <!-- Lower cone filled/outlined -->
  <path d="M 140 260 L 200 160 L 260 260 A 60 22 0 0 0 140 260 Z" fill="none" stroke="none" />
  <path d="M 140 260 L 200 160 L 260 260" stroke="#0f172a" stroke-width="1.8" fill="none" />
  <ellipse cx="200" cy="260" rx="60" ry="22" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="4,3" fill="none" />

  <!-- Time-like vector inside cone -->
  <line x1="200" y1="160" x2="225" y2="75" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
  <text x="235" y="80" class="it" font-weight="bold" fill="#0f172a">|ξ<tspan dy="4" font-size="11">+</tspan><tspan dy="-4">|<tspan dy="-5" font-size="11">2</tspan><tspan dy="5"> &gt; 0</tspan></text>

  <!-- Isotropic (light) vector on cone boundary -->
  <line x1="200" y1="160" x2="158.0" y2="90.0" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
  <text x="55" y="150" class="it" font-weight="bold" fill="#0f172a">|ξ<tspan dy="4" font-size="11">0</tspan><tspan dy="-4">|<tspan dy="-5" font-size="11">2</tspan><tspan dy="5"> = 0</tspan></text>

  <!-- Space-like vector outside cone -->
  <line x1="200" y1="160" x2="270" y2="155" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arr)" />
  <text x="250" y="135" class="it" font-weight="bold" fill="#0f172a">|ξ<tspan dy="4" font-size="11">-</tspan><tspan dy="-4">|<tspan dy="-5" font-size="11">2</tspan><tspan dy="5"> &lt; 0</tspan></text>

</svg>