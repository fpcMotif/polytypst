<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Axes -->
  <line x1="160" y1="220" x2="70" y2="280" class="ax" marker-end="url(#arr-axis)" />
  <line x1="160" y1="220" x2="350" y2="220" class="ax" marker-end="url(#arr-axis)" />
  <line x1="160" y1="220" x2="160" y2="40" class="ax" marker-end="url(#arr-axis)" />

  <text x="58" y="296" class="it">x</text>
  <text x="360" y="225" class="it">y</text>
  <text x="144" y="44" class="it">z</text>
  <text x="144" y="236" class="it">0</text>

  <!-- Projection lines -->
  <line x1="160" y1="220" x2="270" y2="255" class="c-dash" />
  <line x1="270" y1="255" x2="270" y2="100" class="c-dash" />

  <!-- Radius vector r -->
  <line x1="160" y1="220" x2="270" y2="100" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)" />
  <text x="203" y="152" class="it" font-weight="bold" fill="#0f172a">r</text>

  <!-- Angle theta arc (from z-axis to r) -->
  <path d="M 160 160 A 60 60 0 0 1 204 172" fill="none" stroke="#334155" stroke-width="1.4" />
  <text x="188" y="152" class="it" fill="#334155">θ</text>

  <!-- Angle phi arc (in xy plane from x-axis to base) -->
  <path d="M 125 244 A 45 45 0 0 0 195 233" fill="none" stroke="#334155" stroke-width="1.4" />
  <text x="156" y="258" class="it" fill="#334155">φ</text>

  <!-- Point P -->
  <circle cx="270" cy="100" r="3.6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <text x="280" y="95" class="it" font-weight="bold">P = (r, θ, φ)</text>

</svg>