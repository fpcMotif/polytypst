<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Fixed frame S -->
  <line x1="90" y1="220" x2="210" y2="258" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <line x1="90" y1="220" x2="210" y2="165" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <line x1="90" y1="220" x2="90" y2="40" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <text x="68" y="45" class="it" fill="#0f172a">x<tspan dy="-5" font-size="11">3</tspan></text>
  <text x="216" y="165" class="it" fill="#0f172a">x<tspan dy="-5" font-size="11">2</tspan></text>

  <!-- Moving frame S' -->
  <line x1="200" y1="255" x2="330" y2="295" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <line x1="200" y1="255" x2="320" y2="200" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <line x1="200" y1="255" x2="200" y2="75" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-axis)" />
  <text x="176" y="80" class="it" fill="#0f172a">x′<tspan dy="-5" font-size="11">3</tspan></text>
  <text x="326" y="200" class="it" fill="#0f172a">x′<tspan dy="-5" font-size="11">2</tspan></text>
  <text x="336" y="302" class="it" fill="#0f172a">x<tspan dy="-5" font-size="11">1</tspan><tspan dy="5">, x′</tspan><tspan dy="-5" font-size="11">1</tspan></text>

  <!-- Velocity vector v -->
  <line x1="240" y1="240" x2="295" y2="258" stroke="#0f172a" stroke-width="2.0" marker-end="url(#arr)" />
  <text x="304" y="258" class="it" font-weight="bold" fill="#0f172a">v</text>

</svg>