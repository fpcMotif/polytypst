<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 L 2 5 z" fill="#334155" />
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0f172a" stroke-width="1.1" />
    </pattern>
    <pattern id="hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0f172a" stroke-width="1.0" />
    </pattern>
  </defs>
  <style>
    text { font-family: "New Computer Modern", "Latin Modern Roman", "STIX Two Math", "Times New Roman", serif; }
    .ax { stroke: #334155; stroke-width: 1.25; fill: none; }
    .c-main { stroke: #0f172a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c-dash { stroke: #64748b; stroke-width: 1.15; stroke-dasharray: 5,4; fill: none; }
    .lbl { font-size: 14.5px; fill: #0f172a; }
    .it { font-size: 15.5px; font-style: italic; fill: #0f172a; }
  </style>

  <!-- Axes -->
  <line x1="180" y1="290" x2="180" y2="40" class="ax" marker-end="url(#arr-axis)" />
  <line x1="70" y1="250" x2="290" y2="130" class="ax" marker-end="url(#arr-axis)" />
  <line x1="80" y1="120" x2="280" y2="260" class="ax" marker-end="url(#arr-axis)" />

  <text x="164" y="45" class="it">z</text>
  <text x="296" y="132" class="it">y</text>
  <text x="68" y="262" class="it">x</text>

  <!-- Sphere silhouette -->
  <circle cx="180" cy="190" r="95" stroke="#0f172a" stroke-width="1.8" fill="none" />

  <!-- Equator / disc slice with cone rays -->
  <ellipse cx="180" cy="117.2257779036971" rx="61.06482292022123" ry="18" stroke="#0f172a" stroke-width="1.6" fill="none" opacity="0.8" />

  <!-- Cone lines from center O to cut boundary -->
  <line x1="180" y1="190" x2="118.93517707977877" y2="117.2257779036971" class="c-dash" />
  <line x1="180" y1="190" x2="241.06482292022122" y2="117.2257779036971" stroke="#0f172a" stroke-width="1.6" />

  <!-- Center O and North Pole N -->
  <circle cx="180" cy="190" r="3.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  <circle cx="180" cy="95" r="3.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <text x="162" y="89" class="it" font-weight="bold">N</text>

  <!-- Angle theta_0 arc -->
  <path d="M 180 155 A 35 35 0 0 1 202 163" fill="none" stroke="#0f172a" stroke-width="1.4" />
  <text x="192" y="148" class="it" fill="#0f172a">θ<tspan dy="3" font-size="10">0</tspan></text>

  <!-- Radius rho along sphere surface -->
  <text x="215.5324114601106" y="105.2257779036971" class="it" font-weight="bold" fill="#0f172a">ρ</text>

</svg>