running_header_regexes = [
  '^(?:#+\s*)?(?:\d{1,3}\s+)?\*?(?:Chapter \d{1,2}|Preface|The Fundamental Equations for Hypersurfaces|Elements of the Theory of Surfaces in .{1,30}|A Compendium of Surfaces|Curves on Surfaces|Complete Surfaces of Constant Curvature|The Gauss-Bonnet Theorem and Related Topics|(?i:Mini-Bibliography for Volume III|Notation Index|Index))\*?(?:\s+\d{1,3})?$',
]

